name: Citation tracker
on:
  schedule: [{cron: '0 14 * * 1'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests && python tools/track_citations.py
      - run: |
          git config user.name "citation-bot"; git config user.email "bot@users.noreply.github.com"
          git add citations.csv
          git diff --cached --quiet || (git commit -m "Update citations" && git push)
